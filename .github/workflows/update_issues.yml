name: Update Issues

on:
  workflow_dispatch:
    inputs:
      create_missing:
        description: 対応する Issue が無い Markdown は新規作成する
        type: boolean
        default: false

jobs:
  update-issues:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Update Issues from docs/issues/
        env:
          GH_TOKEN: ${{ github.token }}
          CREATE_MISSING: ${{ inputs.create_missing }}
        run: ./scripts/update_issues.sh
